<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Robe Of Many Colors AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>The Robe Of Many Colors AI</h1>
        <p>Describe a color, a pattern, or a dream, and add a patch to the robe.</p>
    </header>
    <main>
        <div class="controls">
            <input type="text" id="pattern-input" placeholder="e.g., 'a starry night sky' or 'liquid gold'">
            <button id="add-patch-btn">Add Patch</button>
        </div>
        <div id="loading-indicator" class="hidden">
            <p>Weaving your design...</p>
        </div>
        <div id="robe-container">
            <!-- Patches will be added here by script.js -->
        </div>
    </main>
    <script type="module" src="script.js"></script>
